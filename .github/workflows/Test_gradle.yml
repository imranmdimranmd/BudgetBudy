name: FMGradle Application Build

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FMGradle Application
    runs-on: ubuntu-22.04

    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------
      # Give Gradle wrapper execute permission
      # --------------------------------------------------
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # --------------------------------------------------
      # Display versions
      # --------------------------------------------------
      - name: Check Java and Gradle versions
        run: |
          java -version

      # --------------------------------------------------
      # Run unit tests
      # --------------------------------------------------
